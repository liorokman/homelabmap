<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homelabmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='5' r='2.5'/%3E%3Ccircle cx='5' cy='19' r='2.5'/%3E%3Ccircle cx='19' cy='19' r='2.5'/%3E%3Cpath d='M12 7.5v4M12 11.5l-5.5 5.5M12 11.5l5.5 5.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="vendor/cytoscape.min.js" defer></script>
<script src="vendor/layout-base.js" defer></script>
<script src="vendor/cose-base.js" defer></script>
<script src="vendor/cytoscape-fcose.js" defer></script>
<script src="app.js" type="module"></script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-5.5 5.5M12 11.5l5.5 5.5"/></svg>
    <span>homelabmap</span>
  </div>
  <nav class="tabs" aria-label="View">
    <button type="button" data-view="map" aria-pressed="true">Map</button>
    <button type="button" data-view="table" aria-pressed="false">Table</button>
  </nav>
  <div class="status" id="status" aria-live="polite">Loading…</div>
  <div class="bar-actions">
    <button id="scan-now" class="btn primary" type="button">Scan now</button>
    <div class="menu" id="user-menu">
      <button class="btn ghost menu-button" id="user-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-list">
        <span class="user" id="user">Account</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu-list" id="user-menu-list" role="menu" aria-labelledby="user-button" hidden>
        <button type="button" role="menuitem" id="change-password" hidden>Change password</button>
        <form method="post" action="/auth/logout"><button type="submit" role="menuitem">Sign out</button></form>
      </div>
    </div>
  </div>
</header>

<dialog id="password-dialog" aria-labelledby="password-title">
  <form id="password-form" method="dialog" novalidate>
    <h2 id="password-title">Change password</h2>
    <input type="text" name="username" id="pw-username" autocomplete="username" hidden>
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new" autocomplete="new-password" required minlength="12">
      <small>At least 12 characters. Your other sessions are signed out.</small></label>
    <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" required minlength="12"></label>
    <p class="form-msg" id="password-msg" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="password-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="password-save">Change password</button>
    </div>
  </form>
</dialog>

<div class="layout">
  <aside class="controls" aria-label="Map controls">
    <label class="search">
      <span class="sr-only">Search devices</span>
      <input id="search" type="search" placeholder="Search name, IP, MAC, OS…  ( / )" autocomplete="off">
    </label>

    <fieldset>
      <legend>Show</legend>
      <label><input type="checkbox" id="f-edge" checked> End devices</label>
      <label><input type="checkbox" id="f-virtual" checked> VMs &amp; containers</label>
      <label class="map-only"><input type="checkbox" id="f-stacks"> Open stacks</label>
      <label><input type="checkbox" id="f-unknown" checked> Devices with unknown location</label>
      <label><input type="checkbox" id="f-off" checked> Off or not seen now</label>
      <label class="map-only"><input type="checkbox" id="f-ports"> Port labels on links</label>
    </fieldset>

    <fieldset class="map-only">
      <legend>Layout</legend>
      <div class="seg" role="radiogroup" aria-label="Layout">
        <button type="button" data-layout="fcose" aria-pressed="true">Organic</button>
        <button type="button" data-layout="tree" aria-pressed="false">Tree</button>
        <button type="button" data-layout="radial" aria-pressed="false">Radial</button>
      </div>
      <div class="row">
        <button type="button" class="btn" id="fit">Fit</button>
        <button type="button" class="btn" id="relayout" title="Forget dragged positions and lay out again">Reset positions</button>
      </div>
    </fieldset>

    <fieldset class="map-only">
      <legend>Legend</legend>
      <div id="legend" class="legend"></div>
    </fieldset>

    <details id="warnings" class="warnings" hidden>
      <summary></summary>
      <ul></ul>
    </details>
  </aside>

  <main class="map-wrap">
    <div id="map" class="map" role="img" aria-label="Network topology map"></div>
    <div id="empty" class="empty" hidden></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </main>

  <main id="table-view" class="table-wrap" hidden>
    <div class="table-bar">
      <div class="seg" role="group" aria-label="Table">
        <button type="button" data-table="devices" aria-pressed="true">Devices</button>
        <button type="button" data-table="containers" aria-pressed="false">Containers</button>
        <button type="button" data-table="links" aria-pressed="false">Links</button>
        <button type="button" data-table="sightings" aria-pressed="false">Heard</button>
        <button type="button" data-table="scans" aria-pressed="false">Scans</button>
      </div>
      <span id="table-count" class="src"></span>
      <button type="button" class="btn" id="table-csv">Download CSV</button>
    </div>
    <div class="table-scroll"></div>
  </main>

  <aside id="details" class="details" aria-label="Device details" hidden>
    <button type="button" class="close" id="details-close" aria-label="Close details">×</button>
    <div id="details-body"></div>
  </aside>
</div>
</body>
</html>
